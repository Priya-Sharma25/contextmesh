name: ContextMesh Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Go Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install Dependencies
        run: cd backend && go mod download

      - name: Run Go Vet (Static Analysis)
        run: cd backend && go vet ./...

      - name: Run Backend Unit Tests with Coverage
        run: cd backend && go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Display Coverage Summary
        run: cd backend && go tool cover -func=coverage.out | tail -1

      - name: Enforce Minimum Coverage (70%)
        run: |
          cd backend
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc -l)" -eq 1 ]; then
            echo "❌ Coverage ${COVERAGE}% is below minimum threshold of 70%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets minimum threshold"

      - name: Compile Backend Server Binary
        run: cd backend && go build -o bin/server cmd/server/main.go

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: backend-ci
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t contextmesh-backend:ci -f backend/Dockerfile backend/

  frontend-ci:
    name: Next.js Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Run Production Bundle Build
        run: cd frontend && npm run build
