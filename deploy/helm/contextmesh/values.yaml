# Default values for ContextMesh deployment.

replicaCount: 2

backend:
  image:
    repository: contextmesh/backend
    pullPolicy: IfNotPresent
    tag: "v1.0.0"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

frontend:
  image:
    repository: contextmesh/frontend
    pullPolicy: IfNotPresent
    tag: "v1.0.0"
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: contextmesh.local
      paths:
        - path: /api
          pathType: Prefix
          backend: backend
        - path: /mcp
          pathType: Prefix
          backend: backend
        - path: /
          pathType: Prefix
          backend: frontend
